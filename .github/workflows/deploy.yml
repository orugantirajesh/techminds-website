name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H 72.60.192.209 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='DEPLOY.md' \
            --exclude='deploy.sh' \
            --exclude='serve.sh' \
            --exclude='.DS_Store' \
            --exclude='assets/logo-original.png' \
            ./ root@72.60.192.209:/docker/techminds/site/
